<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentOS – Control Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #05040f;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(96,57,222,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(20,100,180,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 60% 30%, rgba(180,60,220,0.08) 0%, transparent 50%);
      min-height: 100vh;
      color: #e8e4ff;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- content goes here -->
  </div>
</body>
</html>
