<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentOS – Control Panel</title>
  <style>
    :root {
      --accent-purple: #7c6fff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #05040f;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(96,57,222,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(20,100,180,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 60% 30%, rgba(180,60,220,0.08) 0%, transparent 50%);
      min-height: 100vh;
      color: #e8e4ff;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Glass utility ── */
    .glass {
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .glass::before {
      /* static top-edge highlight */
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      pointer-events: none;
    }

    /* ── Live dot ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #3dffa0;
      border-radius: 50%;
      box-shadow: 0 0 8px #3dffa0;
      animation: pulse 2s infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #7c6fff, #4f8fff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; color: #fff;
      box-shadow: 0 0 20px rgba(124,111,255,0.5);
      flex-shrink: 0;
    }
    .logo-text { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; color: #f0edff; }
    .logo-sub  { font-size: 0.7rem; color: #7c6fff; letter-spacing: 0.15em; text-transform: uppercase; }
    .header-right { font-size: 0.78rem; color: #554f88; white-space: nowrap; }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-widget {
      padding: 18px 20px;
    }
    .stat-widget::after {
      content: '';
      position: absolute;
      bottom: -20px; right: -10px;
      width: 80px; height: 80px;
      background: radial-gradient(circle, var(--widget-glow), transparent 70%);
      pointer-events: none;
    }
    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7c6fff;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #f0edff;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-sub {
      font-size: 0.72rem;
      color: #554f88;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-mark">A</div>
        <div>
          <div class="logo-text">AGENTOS</div>
          <div class="logo-sub">Control Panel</div>
        </div>
      </div>
      <div class="header-right">
        <span class="live-dot"></span>6 agents &middot; March 2026
      </div>
    </header>
    <div class="stats-row">
      <div class="glass stat-widget" style="--widget-glow: rgba(124,111,255,0.25)">
        <div class="stat-label">Active Agents</div>
        <div class="stat-value">6</div>
        <div class="stat-sub">All systems nominal</div>
      </div>
      <div class="glass stat-widget" style="--widget-glow: rgba(79,143,255,0.25)">
        <div class="stat-label">Sessions Today</div>
        <div class="stat-value">—</div>
        <div class="stat-sub">Connect data source</div>
      </div>
      <div class="glass stat-widget" style="--widget-glow: rgba(61,255,160,0.20)">
        <div class="stat-label">Skills Available</div>
        <div class="stat-value">70+</div>
        <div class="stat-sub">~/.claude/skills/</div>
      </div>
      <div class="glass stat-widget" style="--widget-glow: rgba(255,100,200,0.20)">
        <div class="stat-label">Tokens Used</div>
        <div class="stat-value">—</div>
        <div class="stat-sub">Connect data source</div>
      </div>
    </div>
    <!-- agent grid goes here -->
  </div>
</body>
</html>
