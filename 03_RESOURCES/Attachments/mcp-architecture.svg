<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace">
  <rect width="800" height="480" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700" letter-spacing="0.5">MCP — Model Context Protocol Architecture</text>

  <!-- HOST process box -->
  <rect x="30" y="60" width="740" height="390" fill="#16213e" stroke="#334155" stroke-width="1.5" rx="10"/>
  <text x="50" y="82" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">HOST PROCESS</text>

  <!-- AI Model -->
  <rect x="60" y="95" width="180" height="90" fill="#0f3460" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="150" y="130" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">AI Model</text>
  <text x="150" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">(Claude / GPT / Gemini)</text>
  <text x="150" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">Generates tool calls</text>

  <!-- MCP Client -->
  <rect x="310" y="95" width="180" height="90" fill="#0f3460" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="400" y="130" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">MCP Client</text>
  <text x="400" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">(Claude Code, Cursor,</text>
  <text x="400" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">n8n, your app)</text>

  <!-- Arrows AI <-> Client -->
  <line x1="242" y1="140" x2="308" y2="140" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="308" y1="150" x2="242" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="274" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">tool calls</text>
  <text x="274" y="168" text-anchor="middle" fill="#94a3b8" font-size="9">results</text>

  <!-- Transport label -->
  <text x="400" y="210" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">JSON-RPC 2.0 TRANSPORT (stdio / SSE / HTTP)</text>
  <line x1="100" y1="216" x2="340" y2="216" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="460" y1="216" x2="700" y2="216" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- MCP Servers -->
  <!-- Server 1 -->
  <rect x="60" y="240" width="160" height="170" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="8"/>
  <text x="140" y="264" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">MCP Server</text>
  <text x="140" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">File System</text>
  <rect x="80" y="292" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="140" y="306" text-anchor="middle" fill="#22d3ee" font-size="10">read_file</text>
  <rect x="80" y="316" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="140" y="330" text-anchor="middle" fill="#22d3ee" font-size="10">write_file</text>
  <rect x="80" y="340" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="140" y="354" text-anchor="middle" fill="#22d3ee" font-size="10">list_directory</text>
  <text x="140" y="390" text-anchor="middle" fill="#64748b" font-size="9">Resources + Tools</text>

  <!-- Server 2 -->
  <rect x="310" y="240" width="160" height="170" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="8"/>
  <text x="390" y="264" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">MCP Server</text>
  <text x="390" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">Web / API</text>
  <rect x="330" y="292" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="390" y="306" text-anchor="middle" fill="#22d3ee" font-size="10">web_search</text>
  <rect x="330" y="316" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="390" y="330" text-anchor="middle" fill="#22d3ee" font-size="10">fetch_url</text>
  <rect x="330" y="340" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="390" y="354" text-anchor="middle" fill="#22d3ee" font-size="10">post_request</text>
  <text x="390" y="390" text-anchor="middle" fill="#64748b" font-size="9">Prompts + Tools</text>

  <!-- Server 3 -->
  <rect x="560" y="240" width="160" height="170" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="8"/>
  <text x="640" y="264" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">MCP Server</text>
  <text x="640" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">Database</text>
  <rect x="580" y="292" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="640" y="306" text-anchor="middle" fill="#22d3ee" font-size="10">query</text>
  <rect x="580" y="316" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="640" y="330" text-anchor="middle" fill="#22d3ee" font-size="10">insert_row</text>
  <rect x="580" y="340" width="120" height="20" fill="#0f2030" rx="4"/>
  <text x="640" y="354" text-anchor="middle" fill="#22d3ee" font-size="10">list_tables</text>
  <text x="640" y="390" text-anchor="middle" fill="#64748b" font-size="9">Resources + Tools</text>

  <!-- Arrows Client -> Servers -->
  <line x1="400" y1="187" x2="140" y2="238" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <line x1="400" y1="187" x2="390" y2="238" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <line x1="400" y1="187" x2="640" y2="238" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="400" y="460" text-anchor="middle" fill="#475569" font-size="10">Each MCP Server exposes: Tools (functions) · Resources (data) · Prompts (templates)</text>
</svg>
