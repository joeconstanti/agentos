<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace">
  <rect width="760" height="380" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="0.5">n8n Workflow — Claude AI Automation Example</text>

  <!-- Node 1: Webhook trigger -->
  <rect x="30" y="80" width="120" height="80" fill="#1e293b" stroke="#f97316" stroke-width="2.5" rx="8"/>
  <rect x="30" y="80" width="120" height="28" fill="#f97316" rx="8"/>
  <rect x="30" y="96" width="120" height="12" fill="#f97316"/>
  <text x="90" y="99" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">TRIGGER</text>
  <text x="90" y="124" text-anchor="middle" fill="#f97316" font-size="11" font-weight="700">Webhook</text>
  <text x="90" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">POST /ingest</text>
  <text x="90" y="153" text-anchor="middle" fill="#94a3b8" font-size="10">{ text, source }</text>

  <!-- Arrow 1→2 -->
  <line x1="152" y1="120" x2="178" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#n1)"/>

  <!-- Node 2: Set Variables -->
  <rect x="180" y="80" width="120" height="80" fill="#1e293b" stroke="#6366f1" stroke-width="2" rx="8"/>
  <rect x="180" y="80" width="120" height="28" fill="#6366f1" rx="8"/>
  <rect x="180" y="96" width="120" height="12" fill="#6366f1"/>
  <text x="240" y="99" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">CORE</text>
  <text x="240" y="124" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">Set</text>
  <text x="240" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">timestamp</text>
  <text x="240" y="153" text-anchor="middle" fill="#94a3b8" font-size="10">= {{ $now }}</text>

  <!-- Arrow 2→3 -->
  <line x1="302" y1="120" x2="328" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#n1)"/>

  <!-- Node 3: Claude AI -->
  <rect x="330" y="65" width="130" height="110" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" rx="8"/>
  <rect x="330" y="65" width="130" height="28" fill="#f59e0b" rx="8"/>
  <rect x="330" y="81" width="130" height="12" fill="#f59e0b"/>
  <text x="395" y="84" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="700">AI NODE</text>
  <text x="395" y="112" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Claude</text>
  <text x="395" y="128" text-anchor="middle" fill="#94a3b8" font-size="10">claude-sonnet-4-6</text>
  <text x="395" y="143" text-anchor="middle" fill="#94a3b8" font-size="10">Summarise + tag</text>
  <text x="395" y="158" text-anchor="middle" fill="#94a3b8" font-size="10">→ JSON output</text>

  <!-- Arrow 3→4 -->
  <line x1="462" y1="120" x2="488" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#n1)"/>

  <!-- Node 4: IF branch -->
  <rect x="490" y="80" width="110" height="80" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="8"/>
  <rect x="490" y="80" width="110" height="28" fill="#22d3ee" rx="8"/>
  <rect x="490" y="96" width="110" height="12" fill="#22d3ee"/>
  <text x="545" y="99" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="700">FLOW</text>
  <text x="545" y="124" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">IF</text>
  <text x="545" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">priority ==</text>
  <text x="545" y="153" text-anchor="middle" fill="#94a3b8" font-size="10">"high"</text>

  <!-- Arrow 4→5a (true) -->
  <line x1="600" y1="100" x2="630" y2="80" stroke="#22d3ee" stroke-width="2" marker-end="url(#n2)"/>
  <text x="618" y="82" fill="#22d3ee" font-size="9">true</text>

  <!-- Arrow 4→5b (false) -->
  <line x1="600" y1="140" x2="630" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#n1)"/>
  <text x="618" y="178" fill="#64748b" font-size="9">false</text>

  <!-- Node 5a: Slack alert -->
  <rect x="632" y="45" width="110" height="70" fill="#1e293b" stroke="#e879f9" stroke-width="2" rx="8"/>
  <rect x="632" y="45" width="110" height="24" fill="#e879f9" rx="8"/>
  <rect x="632" y="57" width="110" height="12" fill="#e879f9"/>
  <text x="687" y="61" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">ACTION</text>
  <text x="687" y="85" text-anchor="middle" fill="#f0abfc" font-size="11" font-weight="700">Slack</text>
  <text x="687" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">Send alert</text>
  <text x="687" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">#urgent</text>

  <!-- Node 5b: Notion save -->
  <rect x="632" y="180" width="110" height="70" fill="#1e293b" stroke="#6ee7b7" stroke-width="2" rx="8"/>
  <rect x="632" y="180" width="110" height="24" fill="#10b981" rx="8"/>
  <rect x="632" y="192" width="110" height="12" fill="#10b981"/>
  <text x="687" y="196" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">ACTION</text>
  <text x="687" y="218" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">Notion</text>
  <text x="687" y="233" text-anchor="middle" fill="#94a3b8" font-size="10">Save page</text>
  <text x="687" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">Inbox DB</text>

  <!-- Bottom section: key concepts -->
  <rect x="30" y="290" width="700" height="70" fill="#0f1c2e" stroke="#1e293b" stroke-width="1" rx="8"/>
  <text x="380" y="312" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">KEY CONCEPTS</text>
  <text x="130" y="333" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">Triggers</text>
  <text x="130" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">Webhook, Schedule,</text>
  <text x="130" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Email, App events</text>
  <text x="290" y="333" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">AI Nodes</text>
  <text x="290" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">Claude, GPT, Gemini,</text>
  <text x="290" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">embeddings, agents</text>
  <text x="460" y="333" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">Integrations</text>
  <text x="460" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">400+ apps: Slack,</text>
  <text x="460" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Notion, GSheets…</text>
  <text x="630" y="333" text-anchor="middle" fill="#e879f9" font-size="11" font-weight="600">Self-hosted</text>
  <text x="630" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">Docker / npm, full</text>
  <text x="630" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">data ownership</text>

  <!-- n8n logo text -->
  <text x="380" y="270" text-anchor="middle" fill="#f97316" font-size="22" font-weight="900" letter-spacing="2">n8n</text>
  <text x="380" y="284" text-anchor="middle" fill="#64748b" font-size="10">Fair-code workflow automation</text>

  <defs>
    <marker id="n1" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="n2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
