name: Skill validation
on:
  pull_request:
  push:
    branches: [main]
# Replace outdated PR checks without cancelling post-merge main validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Identify documentation-only PRs
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          # Confirm checkout has both expected parents before trusting its diff.
          if base=$(git rev-parse --verify HEAD^1) &&
             head=$(git rev-parse --verify HEAD^2) &&
             [[ "$base" == "$BASE_SHA" && "$head" == "$HEAD_SHA" ]] &&
             paths=$(git diff --name-only --no-renames "$base" HEAD --) &&
             [[ -n "$paths" ]] &&
             git diff --quiet --no-renames --diff-filter=m "$base" HEAD -- &&
             git diff --quiet --no-renames "$base" HEAD -- . \
               ':(exclude)README.md' ':(exclude,glob)03_RESOURCES/Docs/**/*.md'; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/skills.py check
      - run: python3 scripts/evaluate_skills.py check
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
        if: steps.changed.outputs.docs_only != 'true'
      - run: git diff --check
